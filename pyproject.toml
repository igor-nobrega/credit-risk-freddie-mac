[project]
name = "credit-risk-freddie-mac"
version = "0.1.0"
description = "Modelagem de risco de credito ponta a ponta (PD, LGD, EAD, ECL) com dados reais do Freddie Mac, 100% local: DuckDB + dbt + Quarto."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb",
    "pyarrow",
    "polars",
    "pandas",
    "pyyaml",
    "psutil",
    "dbt-core",
    "dbt-duckdb",
]

[dependency-groups]
model = [
    "scikit-learn",
    "statsmodels",
    "lightgbm",
    "lifelines",
    "optbinning",
    "shap",
    "matplotlib",
    "seaborn",
    "plotly",
]
notebook = ["jupyterlab", "ipykernel", "jupytext", "nbformat"]
dev = ["ruff", "pytest", "pre-commit", "poethepoet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.uv]
default-groups = ["dev", "model", "notebook"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
check = "python scripts/check_env.py"
smoke = "python scripts/smoke_test.py"
manifest = "python scripts/make_manifest.py"
ingest = "python scripts/ingest_bronze.py"
lint = "ruff check ."
fmt = "ruff format ."
test = "pytest -q"
dbt-debug = "dbt debug --project-dir dbt --profiles-dir dbt"
dbt-smoke = "dbt build --select smoke --project-dir dbt --profiles-dir dbt"
gen-sql = "python scripts/gen_silver_sql.py"
dq-report = "python scripts/report_dq.py"
lab = "jupyter lab"
[tool.poe.tasks.silver]
help = "Silver + DQ: roda os modelos e depois os testes"
sequence = [
  { cmd = "dbt run --select silver dq --project-dir dbt --profiles-dir dbt" },
  { cmd = "dbt test --select silver dq --project-dir dbt --profiles-dir dbt" },
]
